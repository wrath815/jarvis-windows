<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS-Windows</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e8e8ec; min-height: 100vh; }
    #app { display: flex; flex-direction: column; min-height: 100vh; }
    header { padding: 1rem 2rem; border-bottom: 1px solid #1e1e2e; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; font-weight: 600; background: linear-gradient(90deg, #ff6b35, #ff3d00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #888; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    .status-dot.disconnected { background: #f87171; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .orb-container { position: relative; width: 300px; height: 300px; margin-bottom: 2rem; }
    .info { text-align: center; max-width: 600px; }
    .info h2 { font-size: 1.25rem; margin-bottom: 1rem; color: #a8a8b8; }
    .info p { color: #666; line-height: 1.6; }
    .mic-button { margin-top: 2rem; width: 80px; height: 80px; border-radius: 50%; border: none; background: linear-gradient(135deg, #ff6b35, #ff3d00); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, box-shadow 0.2s; }
    .mic-button:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 107, 53, 0.5); }
    .mic-button.listening { animation: pulse 1.5s infinite; background: linear-gradient(135deg, #ff3d00, #cc3300); }
    .mic-button:disabled { opacity: 0.5; cursor: not-allowed; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.7); } 50% { box-shadow: 0 0 0 20px rgba(255, 107, 53, 0); } }
    .mic-icon { width: 32px; height: 32px; color: white; }
    .transcript { margin-top: 2rem; padding: 1rem; background: #12121a; border-radius: 12px; border: 1px solid #1e1e2e; min-height: 100px; max-width: 800px; width: 100%; }
    .transcript-entry { margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid #1e1e2e; }
    .transcript-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .transcript-role { font-size: 0.75rem; text-transform: uppercase; color: #00d4ff; margin-bottom: 0.25rem; }
    .transcript-text { color: #e8e8ec; }
    .links { display: flex; gap: 1.5rem; margin-top: 2rem; }
    .links a { color: #888; text-decoration: none; font-size: 0.875rem; transition: color 0.2s; }
    .links a:hover { color: #00d4ff; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>JARVIS-Windows</h1>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>
    <main>
      <div class="orb-container">
        <canvas id="orbCanvas"></canvas>
      </div>
      <div class="info">
        <h2>Voice-first AI assistant for Claude Code</h2>
        <p>Click the microphone and speak. JARVIS will brainstorm, design, and build with you.</p>
        <button class="mic-button" id="micButton" disabled>
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </button>
      </div>
      <div class="transcript" id="transcript"></div>
      <div class="links">
        <a href="/dashboard.html" target="_blank">Dashboard</a>
        <a href="https://github.com/ethanplusai/jarvis" target="_blank">Original JARVIS</a>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
